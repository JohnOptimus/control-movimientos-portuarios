<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Control portuario</title>
    <meta name="theme-color" content="#12263A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Control portuario" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.svg" />
    <link rel="icon" href="icon-192.svg" type="image/svg+xml" />
    <style>
      :root {
        --navy-900: #0f2235;
        --navy-800: #12263a;
        --navy-700: #183a52;
        --slate: #8fa3b5;
        --mist: #edf3f7;
        --gold: #f2b705;
        --blue: #5b9bd5;
        --blue-soft: #8bb8e8;
        --shadow: rgba(9, 20, 32, 0.28);
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--navy-900);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        color: var(--mist);
      }

      #app {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #0d1d2a 0%, #12263a 100%);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #f6f9fb;
      }

      .screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 28px 22px;
        text-align: center;
        background: radial-gradient(circle at top, #183c59 0%, #12263a 50%, #0d1d2a 100%);
        color: var(--mist);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      .screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .screen img {
        width: 90px;
        height: 90px;
        border-radius: 22px;
        box-shadow: 0 14px 26px rgba(0, 0, 0, 0.2);
      }

      .screen h1 {
        margin: 0;
        font-size: clamp(1.25rem, 2vw, 1.7rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .screen p {
        margin: 0;
        max-width: 32ch;
        color: rgba(237, 243, 247, 0.8);
        line-height: 1.5;
        font-size: 0.96rem;
      }

      .bar {
        width: min(70vw, 190px);
        height: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        overflow: hidden;
      }

      .bar::after {
        content: "";
        display: block;
        width: 35%;
        height: 100%;
        background: linear-gradient(90deg, var(--gold), #ffd85b);
        border-radius: inherit;
        animation: slide 1.1s ease-in-out infinite;
      }

      @keyframes slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar::after { animation: none; width: 100%; }
      }

      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(180deg, #f9c73d 0%, var(--gold) 100%);
        color: var(--navy-800);
        font-weight: 700;
        padding: 12px 22px;
        box-shadow: 0 12px 24px rgba(242, 183, 5, 0.24);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.8);
        outline-offset: 2px;
      }

      #refresh {
        position: fixed;
        right: 14px;
        bottom: calc(14px + var(--safe-bottom));
        z-index: 25;
        width: 48px;
        height: 48px;
        padding: 0;
        border-radius: 50%;
        background: rgba(18, 38, 58, 0.9);
        color: var(--mist);
        box-shadow: 0 12px 22px rgba(0, 0, 0, 0.3);
        display: grid;
        place-items: center;
        backdrop-filter: blur(8px);
      }

      #refresh svg {
        width: 22px;
        height: 22px;
      }

      #refresh.spin svg {
        animation: rot 0.8s linear;
      }

      @keyframes rot {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <iframe id="viewer" title="Control portuario" allow="fullscreen; clipboard-write"></iframe>
    </div>

    <button id="refresh" type="button" aria-label="Actualizar datos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3-6.7" />
        <path d="M21 3v6h-6" />
      </svg>
    </button>

    <div id="loading" class="screen" role="status" aria-live="polite">
      <img src="icon-192.svg" alt="Control portuario" />
      <h1>Control portuario</h1>
      <div class="bar"></div>
      <p>Cargando datos…</p>
    </div>

    <div id="error" class="screen hidden" role="alert">
      <img src="icon-192.svg" alt="Control portuario" />
      <h1>No se pudo cargar</h1>
      <p id="errorMsg">Revisa tu conexión a internet e inténtalo de nuevo.</p>
      <button id="retry" type="button">Reintentar</button>
    </div>

    <script>
      const APP_URL = "https://script.google.com/macros/s/AKfycbz-I5ssU-lTnHVMOtfxigf6GADjfaBd08fCpiSgLFN7tRippiHoRGAUQKjknS8kpM0q/exec";
      const TIMEOUT_MS = 20000;

      const viewer = document.getElementById("viewer");
      const loading = document.getElementById("loading");
      const errorScreen = document.getElementById("error");
      const errorMsg = document.getElementById("errorMsg");
      const refreshBtn = document.getElementById("refresh");
      let timer;

      function show(el) {
        el.classList.remove("hidden");
      }

      function hide(el) {
        el.classList.add("hidden");
      }

      function load() {
        hide(errorScreen);
        show(loading);
        clearTimeout(timer);

        if (!navigator.onLine) {
          return fail("Sin conexión a internet. Conéctate y toca Reintentar.");
        }

        timer = setTimeout(() => {
          fail("La aplicación tardó demasiado en responder. Toca Reintentar.");
        }, TIMEOUT_MS);

        viewer.src = APP_URL + (APP_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
      }

      function fail(msg) {
        clearTimeout(timer);
        errorMsg.textContent = msg;
        hide(loading);
        show(errorScreen);
      }

      viewer.addEventListener("load", () => {
        if (!viewer.src || viewer.src === "about:blank") return;
        clearTimeout(timer);
        hide(loading);
      });

      document.getElementById("retry").addEventListener("click", load);

      refreshBtn.addEventListener("click", () => {
        refreshBtn.classList.add("spin");
        setTimeout(() => refreshBtn.classList.remove("spin"), 900);
        load();
      });

      window.addEventListener("online", load);
      window.addEventListener("offline", () => {
        fail("Sin conexión a internet. Conéctate y toca Reintentar.");
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }

      load();
    </script>
  </body>
</html>
